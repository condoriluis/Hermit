[package]
name = "hermit-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4"] }
napi-derive = "2.16"
symphonia = { version = "0.5", default-features = false, features = ["pcm", "wav", "mp3", "isomp4", "aac"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[build-dependencies]
napi-build = "2"
