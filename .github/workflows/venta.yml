# La app que se vende sale de la rama `venta`: cada push compila Hermit en Windows, Mac (Intel y Apple Silicon) y Linux,
# y publica sus instaladores en el cobro (`npm run compilar` y `npm run publicar` en cada sistema), los que da myhermit.vercel.app.
# Cada push sale como versión nueva (scripts/version-venta.mjs, una sola vez para todos), y la app instalada ofrece
# «Actualizar a Hermit X» y baja solo lo que cambió (electron/main.ts).
# Para publicar lo de main: `git push origin main:venta`. La llave para publicar es el secreto PUBLICAR del repo. La firma
# de Apple, si está, va en los secretos CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID
# (docs/adr/0006-mac-y-linux.md); la de Windows, en WIN_CSC_LINK y WIN_CSC_KEY_PASSWORD (docs/adr/0017-firma-de-windows.md);
# sin ellos, esos instaladores salen sin firma. Siempre el mismo certificado: macOS solo se actualiza a una versión firmada
# por el mismo equipo de Apple que la instalada. Quien apoya recibe cada versión 7 días
# antes (`ANTICIPO` del Worker); un arreglo urgente sale para todos de inmediato con `[para todos]` en el mensaje del
# commit, o con esa opción a mano en «Run workflow».
name: Publicar Hermit

on:
  push:
    branches: [venta]
  workflow_dispatch:
    inputs:
      para_todos:
        description: 'Para todos de inmediato (un arreglo urgente), sin los 7 días de quien apoya'
        type: boolean
        default: false

# Una a la vez: dos publicaciones juntas se pisarían la versión.
concurrency:
  group: venta
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: node scripts/version-venta.mjs >> "$GITHUB_OUTPUT"
        env:
          PUBLICAR: ${{ secrets.PUBLICAR }}

  publicar:
    needs: version
    strategy:
      # Si uno falla, los otros publican igual: cada sistema tiene su propia última versión.
      fail-fast: false
      matrix:
        # Dos de Mac, cada una en su procesador y con su última versión en el cobro (docs/adr/0006).
        os: [windows-latest, macos-15-intel, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Para los cuatro sistemas: HERMIT_TUYO revisa que lo que se vende no lleve nada del dueño, y electron-builder
    # firma con lo que haya de Apple (CSC_*) o de Windows (WIN_CSC_*).
    env:
      HERMIT_TUYO: ${{ secrets.HERMIT_TUYO }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # El Node que viaja dentro de la app: el mismo con que se prueba en la computadora del dueño.
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `npm run compilar` compila el módulo nativo (crates/hermit-native) antes de
      # empaquetar: viaja con el servidor para no abrir un FFmpeg por cada onda.
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/version-venta.mjs
        env:
          VERSION: ${{ needs.version.outputs.version }}
      # El DMG de Mac se arma montando un volumen y desmontándolo al final (dmgbuild, por dentro con hdiutil). Si algo
      # lo tiene tomado —Spotlight indexa todo lo que se monta—, el desmontaje falla con «Resource busy» y se cae la
      # compilación: le pasó a la 0.3.49 en el Mac Intel. Se apaga Spotlight antes, y se reintenta por si vuelve.
      - name: Apagar Spotlight
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - name: Compilar
        if: runner.os != 'macOS'
        run: npm run compilar
      - name: Compilar (Mac)
        if: runner.os == 'macOS'
        run: |
          for intento in 1 2 3; do
            npm run compilar && exit 0
            echo "::warning::La compilación falló (intento $intento); desmonto lo que quedara montado y la repito."
            for v in /Volumes/Hermit*; do hdiutil detach -force "$v" >/dev/null 2>&1 || true; done
          done
          exit 1
      - run: npm run publicar
        env:
          PUBLICAR: ${{ secrets.PUBLICAR }}
          PARA_TODOS: ${{ (inputs.para_todos || contains(github.event.head_commit.message, '[para todos]')) && '1' || '' }}
          # Para que el cobro sepa si la de Mac se abre a la primera.
          FIRMADA: ${{ secrets.CSC_LINK != '' && '1' || '' }}
