<!doctype html>
<!--
  La guía de lo nuevo de la 0.5.0: sale una vez al abrir Hermit después de actualizar (web/src/Novedades.tsx, en un
  iframe), y también se abre sola en un navegador. Una página suelta, sin dependencias: el logo (web/public/icon.svg)
  va adentro, en #cara. Seis escenas (el concierto, tres novedades, los arreglos y el final, que es el mismo concierto);
  cada una tiene su guion en `guiones`, y «Siguiente», las flechas o deslizar pasan de una a otra. Con ?escena=N abre
  directo en una. Para la de otra versión: cambia sus escenas 1 a 4, el número (título, cabecera y el del escenario de
  la escena 0; la pantalla del final lo toma del título) y el texto de la despedida.
-->

<title>Hermit 0.5.0</title>
<style>
  /* Paleta de Hermit (web/src/tokens.css). */
  :root {
    --bg: #0a0e14; --panel: #111722; --panel-2: #18212f; --line: #263244; --text: #e6edf7; --muted: #94a3b8;
    --acento: #4f8cff; --acento-2: #6ea8fe; --sobre-acento: #07101f; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; color: var(--text); font-family: Inter, 'Segoe UI', system-ui, sans-serif; }
  .escenario { position: relative; width: min(100vw, 100vh); max-width: 1080px; aspect-ratio: 1; user-select: none; -webkit-user-select: none; }
  .escenario > svg, .escenario > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  canvas { pointer-events: none; }
  .controles { position: absolute; left: 8.33%; right: 8.33%; bottom: 3.2%; display: flex; align-items: center; gap: 12px; font-size: clamp(12px, 1.85vmin, 20px); }
  .controles button { font: inherit; font-weight: 700; border-radius: 12px; padding: .8em 1.25em; cursor: pointer; border: 2px solid var(--line); background: var(--panel); color: var(--text); display: inline-flex; align-items: center; gap: .55em; transition: transform .12s, background-color .2s, border-color .2s, opacity .3s; }
  .controles button:hover { border-color: var(--muted); }
  .controles button:active { transform: scale(.95); }
  .controles button:focus-visible { outline: 3px solid var(--acento-2); outline-offset: 3px; }
  .controles svg { width: 1.25em; height: 1.25em; }
  #siguiente { margin-left: auto; background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
  #siguiente:hover { background: var(--acento-2); border-color: var(--acento-2); }
  #anterior.oculto { opacity: 0; pointer-events: none; }
  #cuenta { flex: 1; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }

  .a { transform-box: fill-box; transform-origin: center; }
  .izq { transform-box: fill-box; transform-origin: 0 50%; }
  .abajo { transform-box: fill-box; transform-origin: 50% 100%; }
  .arriba { transform-box: fill-box; transform-origin: 50% 0; }
  .escena { display: none; }
  .escena.visible { display: inline; }
  #rayos { transition: opacity .9s; }
  #brillo stop { transition: stop-color 1s; }
  .num { font-variant-numeric: tabular-nums; }
  .gira3d, .gira-cubo { transform-box: fill-box; transform-origin: center; }

  /* Lo que se mueve siempre: el cangrejo baila y los rayos giran. */
  .gira { animation: girar 40s linear infinite; }
  .baila { animation: bailar .96s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes bailar {
    0%, 100% { transform: translateY(0) rotate(-6deg) scale(1.04, .96); }
    25% { transform: translateY(-40px) rotate(0) scale(1); }
    50% { transform: translateY(0) rotate(6deg) scale(1.04, .96); }
    75% { transform: translateY(-40px) rotate(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .gira, .baila { animation: none; } }
</style>

/* ---------- Lo común de las novedades ---------- */
function textos(e, base = 200) {
  const k = en(e, '.kicker');
  if (k) A(k, [{ opacity: 0, transform: 'translateX(-30px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: base });
  todos(e, '.palabra').forEach((w, i) => A(w, [{ opacity: 0, transform: 'translateY(60px) rotate(8deg) scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: base + 120 + i * 80, easing: REBOTE }));
  todos(e, '.linea').forEach((l, i) => aparece(l, { duration: 650, delay: base + 480 + i * 120 }));
}
async function mover(cur, de, a, ms) {
  const [x0, y0] = de, [x1, y1] = a;
  A(cur, [{ transform: `translate(${x0}px, ${y0}px)`, opacity: 0 }, { transform: `translate(${(x0 + x1) / 2 + 60}px, ${(y0 + y1) / 2 - 50}px)`, opacity: 1, offset: 0.45 }, { transform: `translate(${x1}px, ${y1}px)`, opacity: 1 }], { duration: ms, easing: 'cubic-bezier(.45,0,.2,1)' });
  await espera(ms);
}
function clic(e, cur, x, y) {
  en(cur, '.punta').animate([{ transform: 'scale(1)' }, { transform: 'scale(.8)' }, { transform: 'scale(1)' }], { duration: 260 });
  const ondas = en(e, '.cuerpo');
  for (const [r, d] of [[18, 0], [30, 90]]) {
    const o = el('circle', { cx: x, cy: y, r, fill: 'none', stroke: C.acento2, 'stroke-width': 4, class: 'a temporal' }, ondas);
    A(o, [{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(2.4)', opacity: 0 }], { duration: 600, delay: d, easing: 'ease-out' });
  }
}

/* ---------- Las escenas ---------- */
const guiones = [

    // El número cae al ritmo, un golpe por cifra
    const letras = todos(en(e, '.version-neon'), '.letra');

    await espera(1700); if (!vivo()) return;
    for (const l of letras) {
      await espera(240); if (!vivo()) return;

      await espera(BEAT - 240); if (!vivo()) return;
    }
    explota(e, en(e, '.version-neon'));
    await espera(1400); if (!vivo()) return;
    pulsar();
    polvo(vivo);
  },
  // 1 · El motor: los pasos de hacer.py se palomean en orden
  async (e, vivo) => {
